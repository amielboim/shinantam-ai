    <path d="M176 205c0-19 15-34 34-34h112c19 0 34 15 34 34v104c0 19-15 34-34 34H210c-19 0-34-15-34-34Z" fill="url(#page)" stroke="#17204D" stroke-width="10"/>
    <path d="M258 179v151" stroke="#D6AA55" stroke-width="8"/>
    <path d="M198 190c0-14 10-24 24-24s24 10 24 24v131c0 14-10 24-24 24s-24-10-24-24Z" fill="#F2D28E" stroke="#17204D" stroke-width="9"/>
    <path d="M270 190c0-14 10-24 24-24s24 10 24 24v131c0 14-10 24-24 24s-24-10-24-24Z" fill="#F2D28E" stroke="#17204D" stroke-width="9"/>
    <path d="M215 216h32m-32 24h32m-32 24h32m-32 24h27M269 216h32m-32 24h32m-32 24h32m-32 24h27" stroke="#263165" stroke-width="7"/>
    <path d="M213 158v-18a9 9 0 0 1 18 0v18m72 0v-18a9 9 0 0 1 18 0v18" fill="#F2D28E" stroke="#17204D" stroke-width="8"/>
    <path d="M206 188h32m72 0h32" stroke="#DCA94D" stroke-width="9"/>
  </g>

  <!-- Voice and AI bubble -->
  <path d="M365 120c0-34 27-61 62-61s62 27 62 61-27 61-62 61h-18l-26 18 7-30c-15-11-25-29-25-49Z" fill="#147FA4" stroke="#B3FFF0" stroke-width="8" stroke-linejoin="round"/>
  <g stroke="#C5FFF5" stroke-width="7" stroke-linecap="round">
    <path d="M400 119v5m14-18v31m14-42v53m14-39v25m14-17v9"/>
  </g>
  <circle cx="399" cy="121" r="3.5" fill="#C5FFF5"/>
  <circle cx="456" cy="121" r="3.5" fill="#C5FFF5"/>

  <!-- A broad road curves beneath the Torah, with a small travelling car -->
  <path d="M37 477c76-74 132-92 197-88 63 4 92 36 145 25 35-7 64-27 96-62" fill="none" stroke="#138CA2" stroke-width="57" stroke-linecap="round"/>
  <path d="M37 477c76-74 132-92 197-88 63 4 92 36 145 25 35-7 64-27 96-62" fill="none" stroke="url(#road)" stroke-width="39" stroke-linecap="round"/>
