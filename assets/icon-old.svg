  <path d="M115 247c0-87 64-151 151-151s151 64 151 151-64 151-151 151c-17 0-34-3-49-8l-63 37 19-65c-36-28-58-68-58-115Z" fill="url(#bubble)" stroke="#83F1E4" stroke-width="9" stroke-linejoin="round"/>
  <path d="M143 247c0-70 53-123 123-123s123 53 123 123-53 123-123 123c-17 0-33-3-48-9" fill="none" stroke="#B3FFF0" stroke-width="4" opacity=".65"/>
  <circle cx="266" cy="147" r="6" fill="#C3FFF4"/>
  <circle cx="363" cy="246" r="6" fill="#C3FFF4"/>
  <circle cx="170" cy="246" r="6" fill="#C3FFF4"/>

