<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Torah scroll, learning road, and AI">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#102A3A"/>
      <stop offset="1" stop-color="#071722"/>
    </linearGradient>
    <linearGradient id="scroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4D8"/>
      <stop offset="1" stop-color="#E7C47B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#night)"/>
  <circle cx="256" cy="245" r="190" fill="none" stroke="#4E7782" stroke-width="3" opacity=".28"/>

  <!-- Open Torah scroll -->
  <g stroke-linejoin="round">
    <path d="M166 164c0-18 14-32 32-32h116c18 0 32 14 32 32v119c0 18-14 32-32 32H198c-18 0-32-14-32-32z" fill="url(#scroll)" stroke="#F5DFAE" stroke-width="8"/>
    <path d="M202 152v143M310 152v143" stroke="#B98036" stroke-width="8" opacity=".9"/>
    <path d="M150 151c0-12 9-21 21-21s21 9 21 21v145c0 12-9 21-21 21s-21-9-21-21z" fill="#D9A94E" stroke="#F8DE9C" stroke-width="7"/>
    <path d="M320 151c0-12 9-21 21-21s21 9 21 21v145c0 12-9 21-21 21s-21-9-21-21z" fill="#D9A94E" stroke="#F8DE9C" stroke-width="7"/>
    <path d="M219 180h74M219 207h74M219 234h74M219 261h52" stroke="#A37840" stroke-width="7" stroke-linecap="round" opacity=".75"/>
  </g>

  <!-- Broad road passing beneath the Torah scroll -->
  <path d="M42 434c54-49 113-72 168-63 48 8 82 39 130 35 47-4 85-30 131-67" fill="none" stroke="#48A9A7" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 434c54-49 113-72 168-63 48 8 82 39 130 35 47-4 85-30 131-67" fill="none" stroke="#DDF8E9" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 20"/>
  <circle cx="42" cy="434" r="16" fill="#F3D080" stroke="#FFF1C9" stroke-width="6"/>

  <!-- Small AI mark -->
  <g transform="translate(367 83)">
    <circle cx="40" cy="40" r="39" fill="#17384A" stroke="#86D5CD" stroke-width="5"/>
    <path d="M40 1v10M40 69v10M1 40h10M69 40h10M12 12l8 8M60 60l8 8M68 12l-8 8M20 60l-8 8" stroke="#86D5CD" stroke-width="5" stroke-linecap="round"/>
    <text x="40" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="-1" fill="#FFF0C6">AI</text>
  </g>
</svg>

